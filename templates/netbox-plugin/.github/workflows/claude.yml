name: claude

# Lane B (unattended) driver for {{PROJECT_NAME}}. Fires when the `claude-go`
# label is applied to an issue, or on demand via workflow_dispatch.
#
# Lane discipline: issues carrying `lane:interactive` are meant to be driven
# by hand and are excluded from the automatic path below (still runnable
# deliberately via workflow_dispatch). `lane:manual` is excluded outright.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to implement (overrides lane exclusions)"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'claude-go' &&
       !contains(github.event.issue.labels.*.name, 'lane:interactive') &&
       !contains(github.event.issue.labels.*.name, 'lane:manual')) ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A collaborator's @claude comment was already the only kind that could reach here
      # (the job-level `if:` above used to check author_association itself) -- moved into a
      # step, not the job if:, because the *other* authorized commenter is this project's own
      # recorded requester, and confirming that means reading README.md, which needs
      # actions/checkout first; the job-level `if:` runs before any checkout and only has the
      # event payload to work with. Without this, the requester could approve/reject PRs
      # (review-decision.yml) but never actually direct what gets built -- @claude comments
      # were collaborator-only, so the requester's only real feedback channel was binary
      # accept/reject on something already drafted, never "make this red instead."
      - name: Authorize
        id: auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "issue_comment" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "${{ github.event.comment.author_association }}" in
            OWNER|MEMBER|COLLABORATOR)
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # Not a collaborator -- tolerate zero matches (older repos, no "Requested by" line
          # yet) rather than crash: grep exits 1 on no match, and under pipefail that would
          # otherwise trip set -e before this check ever completes. Same pattern and same
          # reasoning as review-decision.yml's identical extraction.
          requester=$(grep -oE '\[@[A-Za-z0-9-]+\]\(https://github\.com/[A-Za-z0-9-]+\)' README.md \
            | head -n1 | sed -E 's/\[@([A-Za-z0-9-]+)\].*/\1/' || true)
          login="${{ github.event.comment.user.login }}"

          if [ -n "$requester" ] && [ "$login" = "$requester" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
              --body "Only this project's recorded requester (@$requester) or a repo collaborator can direct changes via an @claude comment -- @$login is neither, so this wasn't actioned."
          fi

      - name: Resolve target issue and model
        id: cfg
        if: steps.auth.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            num="${{ inputs.issue_number }}"
          else
            num="${{ github.event.issue.number }}"
          fi
          echo "number=$num" >> "$GITHUB_OUTPUT"

          labels=$(gh issue view "$num" --repo "$GITHUB_REPOSITORY" \
                     --json labels --jq '[.labels[].name] | join(",")')
          echo "Issue #$num labels: $labels"

          # Inject the issue title/body into the prompt rather than relying on
          # Claude shelling out to `gh` to discover its own task: on a
          # workflow_dispatch run the issue body is not part of the event
          # payload, and a denied tool call leaves the agent with nothing to
          # work from. Uses a random heredoc delimiter so issue text cannot
          # terminate the block early.
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "title<<$delim"
            gh issue view "$num" --repo "$GITHUB_REPOSITORY" --json title --jq .title
            echo "$delim"
            echo "body<<$delim"
            gh issue view "$num" --repo "$GITHUB_REPOSITORY" --json body --jq .body
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

          # On an issue_comment-triggered run, the comment is only ever checked by the `if:`
          # above as a trigger condition -- its actual text was never read into the prompt,
          # so a human posting "@claude, actually do X instead" had that instruction silently
          # discarded and every retry re-solved the exact same original issue text from
          # scratch. Found live, 2026-08-18: two consecutive @claude retries with materially
          # different follow-up instructions produced near-identical responses, because both
          # runs only ever saw the unchanged original issue body. Fetched via `gh api` on the
          # comment id (a GitHub-assigned number, safe to interpolate directly) rather than
          # embedding the raw event comment-body expression straight into this script, which
          # would let untrusted comment text break out of the shell command itself.
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            {
              echo "comment_section<<$delim"
              echo "## Triggering comment"
              echo
              echo "This run was triggered by the comment below, posted on this issue after the description above. If it gives updated instructions, corrections, or clarification, follow those over the original description above -- it's newer."
              echo
              gh api "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}" --jq .body
              echo "$delim"
            } >> "$GITHUB_OUTPUT"
          else
            echo "comment_section=" >> "$GITHUB_OUTPUT"
          fi

          # The `model:opus`/`model:haiku` labels move off the Sonnet default in either
          # direction -- opus escalates for genuinely high-judgment issues, haiku steps down
          # for purely mechanical ones (templating, formatting, status-only changes). opus
          # wins if both are somehow present, since under-thinking a judgment call is more
          # expensive to recover from than over-thinking a mechanical one.
          if printf '%s' "$labels" | grep -q 'model:opus'; then
            echo "model=claude-opus-5" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$labels" | grep -q 'model:haiku'; then
            echo "model=claude-haiku-5" >> "$GITHUB_OUTPUT"
          else
            echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT"
          fi

      # Give the agent a real NetBox to introspect. Without this the runner
      # has no netbox package installed, so every NetBox-specific API
      # decision (module contents, base classes, migration names) is an
      # unverifiable guess that only gets checked once CI runs on the PR.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone NetBox
        run: git clone --depth 1 --branch "{{NETBOX_VERSION}}" https://github.com/netbox-community/netbox.git /tmp/netbox

      - name: Install NetBox and plugin dependencies
        continue-on-error: true
        run: |
          pip install -r /tmp/netbox/requirements.txt
          pip install -e .

      - name: Record start time
        id: timer
        if: steps.auth.outputs.authorized == 'true'
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.auth.outputs.authorized == 'true'
        with:
          # Authenticates against the Claude subscription, NOT pay-per-token
          # API billing. `anthropic_api_key` is deliberately NOT set here: it
          # bills API usage separately from the subscription, so setting it
          # would mean paying twice. Mint this token with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Prefer a PAT when present: PRs opened with the default GITHUB_TOKEN
          # do NOT trigger other workflows, so CI would silently never run on
          # Claude's PRs. Falls back to GITHUB_TOKEN until GH_PAT is set.
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # track_progress disabled unconditionally: on ai-app-factory's own
          # runs, every issues/issue_comment-triggered run with it enabled
          # pushed its branch but never actually created the PR object (fell
          # back to a manual "Create PR" link instead), while every
          # workflow_dispatch run (track_progress false) succeeded — 4/4 vs
          # 2/2 across issues #1-#12 on 2026-08-17. Losing the live
          # progress-checklist comment is a far smaller cost than silently
          # losing PRs.
          track_progress: false
          base_branch: "{{BASE_BRANCH}}"
          prompt: |
            Implement issue #${{ steps.cfg.outputs.number }} in this repository.

            ## Issue #${{ steps.cfg.outputs.number }}: ${{ steps.cfg.outputs.title }}

            ${{ steps.cfg.outputs.body }}

            ${{ steps.cfg.outputs.comment_section }}

            ## Instructions

            Read CLAUDE.md first and obey it: conventions, the repo map, and
            the definition of done.

            You are running unattended. Nobody can approve a tool call or
            answer a question mid-run, so asking will simply end the run with
            nothing done. Work with the tools you have.

            Before doing any other exploration or writing any code, check
            whether this issue depends on work from an earlier milestone that
            is not merged yet. If so, stop immediately and post one comment
            explaining the blocker -- do not spend turns building against
            something that doesn't exist yet in the hope it lands first.
            Checking this first is strictly cheaper than checking it last.

            NetBox and this plugin's dependencies are installed on this
            runner, with NetBox cloned to /tmp/netbox. Verify NetBox APIs
            against the installed package rather than assuming them — check
            what a module actually exports and what a base class already
            provides before you rely on any of it, e.g.:

                python -c "import netbox.plugins as p; print(dir(p))"

            There is no Postgres or Redis here, so anything needing a database
            (migrate, test) still belongs to CI — but imports, exports, and
            file layout are all checkable locally.

            Implement the issue per its acceptance criteria, touching only
            files named in the issue or in CLAUDE.md's repo map. This is a
            NetBox plugin: the Python package is {{PYTHON_PACKAGE}}.

            Run the checks listed in CLAUDE.md for real and fix until they are
            clean -- do not open a PR without having actually run them. NetBox
            and this plugin's dependencies are already installed on this
            runner. If some genuinely required tooling cannot be installed
            here, say so plainly in the PR description rather than inventing
            a workaround; that should be rare.

            If the test suite fails and you cannot fix it within this run, do
            **not** open a PR. Instead:
            1. Comment on the issue explaining what failed and why.
            2. Apply the `pipeline:failed` label to it:
               `gh issue edit ${{ steps.cfg.outputs.number }} --repo ${{ github.repository }} --add-label pipeline:failed`
            3. Stop.
            This pipeline auto-merges on green CI once a PR opens (see
            .github/workflows/test.yml and the merge step below) — a PR that
            only says "I couldn't verify this" would ship unverified code
            instead of catching it, which is worse than no PR at all.

            Finish by opening a pull request against {{BASE_BRANCH}}. Its
            description must include the line "Closes #${{ steps.cfg.outputs.number }}",
            and should explain what you implemented and how you verified it
            actually passes, not just that you wrote it.

            If the acceptance criteria are genuinely ambiguous, post one
            comment on the issue explaining the blocker instead of guessing —
            then stop.
          claude_args: >-
            --model ${{ steps.cfg.outputs.model }}
            --max-turns 200
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(pip:*),Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(ruff:*),Bash(pre-commit:*),Bash(jq:*),Bash(mkdir:*),Bash(ls:*),Bash(cat:*),Edit,Read,Write,Glob,Grep"

      # --- Journal capture -------------------------------------------------
      # Both steps run with always() so failed and turn-capped runs are
      # recorded too — execution_file is written before the action raises its
      # terminal error, so those runs still carry full metrics.

      - name: Upload execution transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-issue-${{ steps.cfg.outputs.number }}-run-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 90

      - name: Append journal entry
        if: always() && steps.auth.outputs.authorized == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.cfg.outputs.number }}
          MODEL: ${{ steps.cfg.outputs.model }}
          RESULT: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          START: ${{ steps.timer.outputs.start }}
        run: |
          export DURATION=$(( $(date +%s) - START ))
          export ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          export MILESTONE=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json milestone --jq '.milestone.title // "—"')
          export PR_REF=$(gh pr list --repo "$GITHUB_REPOSITORY" --search "linked:issue-$ISSUE_NUMBER" --json number --jq 'if length>0 then "#\(.[0].number)" else "—" end' 2>/dev/null || echo "—")
          bash .github/scripts/journal-entry.sh
