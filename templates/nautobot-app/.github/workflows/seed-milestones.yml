name: seed-milestones

# M6 (redesigned 2026-08-17): turns {{PROJECT_NAME}}'s own approved design doc into GitHub
# milestones and claude-go-labeled issues. Runs with THIS repo's own secrets, not
# ai-app-factory's -- ai-app-factory's own automation never reaches into another repo (see
# its DESIGN.md, "GH_PAT: token strategy"). The design doc lives in ai-app-factory's
# docs/proposals/<repo-name>.md; fetched over an unauthenticated public raw request, since
# ai-app-factory is public and no cross-repo credential should be needed just to read it.
#
# Human-triggered only, once, via workflow_dispatch with no inputs -- nothing here runs
# automatically. That's deliberate: it's the second of two approval gates (after merging
# the design-doc PR in ai-app-factory) between "someone had an idea" and "tokens start
# getting spent building it" -- see ai-app-factory's docs/adr/0001-design-to-issues-loop.md.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the approved design doc from ai-app-factory
        id: doc
        run: |
          set -euo pipefail
          slug="${{ github.event.repository.name }}"
          url="https://raw.githubusercontent.com/mmorrow24work/ai-app-factory/main/docs/proposals/${slug}.md"
          content=$(curl -fsSL "$url") || {
            echo "seed-milestones: could not fetch $url" >&2
            echo "Has the design doc PR for this project been merged in ai-app-factory, and does its filename match this repo's name ('${slug}.md')?" >&2
            exit 1
          }
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "content<<$delim"
            printf '%s\n' "$content"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          # Same subscription-auth rationale as every other workflow in this repo:
          # claude_code_oauth_token, not anthropic_api_key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          track_progress: false
          base_branch: "{{BASE_BRANCH}}"
          prompt: |
            Seed this repository's milestones and issues from its own approved design doc.

            ## Design doc (ai-app-factory's docs/proposals/${{ github.event.repository.name }}.md)

            ${{ steps.doc.outputs.content }}

            ## Instructions

            You are running unattended. Nobody can approve a tool call or answer a
            question mid-run, so asking will simply end the run with nothing done. Work
            from what's given above.

            1. Find the doc's "## Milestones" section -- a bulleted list, one bullet per
               milestone (e.g. "- **M0 — Bootstrap.** ..."). Create one GitHub milestone
               per bullet in THIS repo (`gh api repos/${{ github.repository }}/milestones
               -f title=... -f description=...`), titled `"M<n>: <short title>"` matching
               the bullet's own bold lead-in, with the rest of the bullet's text as the
               description. Skip any milestone whose title already exists (idempotent
               re-run -- this workflow can be fired more than once, e.g. after editing the
               design doc).

            2. For each milestone, create one or more issues in THIS repo
               (`gh issue create`) with a short, concrete acceptance-criteria checklist in
               the body -- follow this repo's own CLAUDE.md (read it first) for
               conventions and definition of done, and match its level of detail and
               phrasing. Attach each issue to its milestone with
               `--milestone "M<n>: <short title>"`. Skip creating an issue that already
               exists with the same title (idempotent re-run).

               **Label every issue that is concrete and unambiguous enough for the
               unattended pipeline `claude-go`, in every milestone -- not just the first
               one.** `.github/workflows/advance.yml` (already present in this repo from its
               template) sequences them in milestone-then-issue-number order and triggers
               each one only once the previous merges, so pre-labeling a later milestone's
               issues does not make them start early. The old convention of only labeling
               the first milestone and leaving the rest for a human to label by hand is
               exactly the "nothing advances the queue" failure this template now avoids --
               see `UNATTENDED-BRIEF.md` in `ai-app-factory` if you want the full story.

               Only leave an issue unlabeled if it is genuinely ambiguous or design-heavy
               enough that a human should read it and decide before it becomes claude-go --
               a real judgement call, not a default.

               **Classify anything that isn't cleanly automatable into exactly one of these
               three -- never leave it as a plain blocking `lane:manual` issue in the
               middle of the sequence:**
               - *Automatable with a secret or a script* (e.g. a scripted data migration or
                 a config change achievable through Nautobot's own management commands) --
                 write it as a normal `claude-go` issue. It is not manual.
               - *Genuinely human judgement* (e.g. deciding a production data model or
                 approving a breaking schema change) -- label it `lane:manual`, but put it
                 in the **highest-numbered milestone** (create one more milestone after the
                 last content milestone if needed) so it sits at the *end* of the sequence,
                 never blocking anything that comes after it.
               - *One-time setup* (an external service credential, a production Nautobot
                 instance URL, anything that needed deciding once at approval time) -- do
                 not create an issue for this at all; note it as a comment on the
                 lowest-numbered milestone instead, since it belongs in the human's initial
                 approval step, not mid-pipeline.

               Rule for all three: **no `lane:manual` issue may block a later issue.** If
               classifying something would create a blocker, reclassify it into one of the
               three categories above instead of leaving it as-is.

            3. This is the only run of this workflow expected under normal use -- once
               finished, THIS repo's own `claude.yml` picks up the first `claude-go` issue
               (in milestone-then-number order) and `advance.yml` carries the rest forward
               automatically as each one merges, with no further action needed here.

            There is no "Closes #N" line to add -- this isn't implementing an issue, it's
            creating them.
          claude_args: >-
            --model claude-opus-5
            --max-turns 150
            --allowedTools "Bash(gh:*),Read,Glob,Grep"

      - name: Upload execution transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-seed-milestones-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 90
