name: draft-design-doc

# M5 (redesigned 2026-08-18, see DESIGN.md's "Write path" and "Requester PII is deliberately
# minimized"): turns a vague ask (project name + freeform requirements, submitted as a GitHub
# issue via the site's /new page) into a drafted design doc, opened as a PR against this
# repo's main for human review.
#
# Triggered on `issues: opened`, filtered to a `[new-project-ask] ` title prefix -- /new builds
# a pre-filled `issues/new?title=[new-project-ask] ...&body=...&labels=new-project-ask` link
# rather than calling any authenticated API, so no credential of any kind ever touches the
# requester's browser. The issue's author (an authenticated GitHub identity, not a
# self-reported form field) is the requester's identity for the rest of the pipeline.
#
# Filtering on the title prefix, not the label, is deliberate and load-bearing: GitHub only
# applies a `labels=` query param on an issues/new deep link for users who already have
# label-write permission on the target repo -- for anyone else it's silently dropped, the
# issue opens unlabeled, and (found the hard way via a real end-to-end test on 2026-08-18,
# opened by the repo owner, who has that permission and so couldn't have caught this) nothing
# would have fired and the requester would get no feedback at all. `title`/`body` query params
# have no such restriction -- they're always honoured, for any GitHub user. This step also
# applies the label itself server-side once resolved, for bookkeeping/search only, never for
# triggering. A `workflow_dispatch` fallback exists purely to retry a failed run against an
# already-open issue -- normal submissions never use it, and it bypasses the prefix check
# entirely since it names the issue explicitly.
#
# The target project's own repo doesn't exist yet at this stage -- DESIGN.md's M6 only runs
# once this PR is approved and merged -- so the draft is staged in *this* repo under
# docs/proposals/ until M6 promotes it.
#
# The "**Requested by:**" line is deliberately NOT left to the LLM step to write -- a
# follow-up step stamps it onto the doc and the PR body directly from the issue's own author
# field, so this can't be skipped, paraphrased, or spoofed. That line travels forward into
# generate-issues.yml, which reads it back out of the design doc to pass
# --set REQUESTER_GITHUB=... to factory-new.sh, landing it in the new repo's README.md.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Intake issue to (re)process -- only for retrying a failed run; issues: opened handles normal submissions automatically"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  draft:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[new-project-ask] ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the intake issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            number="${{ inputs.issue_number }}"
          else
            number="${{ github.event.issue.number }}"
          fi

          data=$(gh issue view "$number" --repo "${{ github.repository }}" --json number,title,body,author)
          title=$(jq -r '.title' <<<"$data")
          login=$(jq -r '.author.login' <<<"$data")
          [ -n "$title" ] || { echo "Issue #$number has no title" >&2; exit 1; }

          marker='[new-project-ask] '
          if [[ "$title" == "$marker"* ]]; then
            title="${title#"$marker"}"
          fi

          # Bookkeeping/search only -- never load-bearing for triggering, see the header
          # comment on why the label itself can't be trusted for that.
          gh issue edit "$number" --repo "${{ github.repository }}" --add-label new-project-ask || true

          slug=$(printf '%s' "$title" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          if [ -z "$slug" ]; then
            echo "Issue title '$title' produced an empty slug" >&2
            exit 1
          fi

          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "number=$number"
            echo "title=$title"
            echo "login=$login"
            echo "slug=$slug"
            echo "body<<$delim"
            jq -r '.body' <<<"$data"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Skip if already processed
        id: dedupe
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "${{ github.repository }}" \
            --search "\"Design: ${{ steps.issue.outputs.title }}\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists for this ask -- skipping (idempotent re-run)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.dedupe.outputs.skip == 'false'
        with:
          # Same subscription-auth rationale as claude.yml: claude_code_oauth_token, not
          # anthropic_api_key, so this doesn't bill API usage on top of the subscription.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          track_progress: false
          base_branch: main
          prompt: |
            Draft a design doc for a new project proposed through the factory's intake issue,
            #${{ steps.issue.outputs.number }}.

            ## Project name

            ${{ steps.issue.outputs.title }}

            ## Requirements (as given -- vague or incomplete is expected; this is a first draft)

            ${{ steps.issue.outputs.body }}

            ## Instructions

            You are running unattended. Nobody can approve a tool call or answer a
            question mid-run, so asking will simply end the run with nothing done.
            Work from what's given above.

            1. Read this repository's own DESIGN.md as a style and structure example
               (Problem / Goal / Non-goals / Architecture / Milestones) and follow its
               shape, adapting sections to fit -- don't force a section that doesn't
               apply to this project.
            2. Create a new branch named `design/${{ steps.issue.outputs.slug }}`.
            3. Write the drafted design doc to `docs/proposals/${{ steps.issue.outputs.slug }}.md`
               on that branch, starting with a single `# Design: ${{ steps.issue.outputs.title }}`
               line as the very first line of the file (a later step inserts a requester-info
               line right after it -- don't add your own "Requested by" section, and don't put
               anything else on that first line). This repo's own root DESIGN.md is this repo's
               own design, not a template to overwrite -- the new project doesn't have its own
               repo yet, so the draft is staged here for review until a later workflow
               promotes it.
            4. Open a pull request against `main` titled
               `Design: ${{ steps.issue.outputs.title }}`, with a description that summarizes
               the drafted design and invites review/edits in this PR. Do not merge it -- review
               and editing happens in the PR's normal GitHub review UI. A later step prepends
               requester identity to your PR description -- don't add your own.

            This is a design proposal for a new project, not an implementation of an issue
            in this repo -- there is no "Closes #N" line to add.
          claude_args: >-
            --model claude-opus-5
            --max-turns 100
            --allowedTools "Bash(git:*),Bash(gh:*),Bash(mkdir:*),Edit,Read,Write,Glob,Grep"

      - name: Stamp requester identity, then close the intake issue
        if: steps.dedupe.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="design/${{ steps.issue.outputs.slug }}"
          doc="docs/proposals/${{ steps.issue.outputs.slug }}.md"
          requested_by="**Requested by:** @${{ steps.issue.outputs.login }}"

          git fetch origin "$branch"
          git checkout "$branch"

          if [ -f "$doc" ] && ! grep -qF "**Requested by:**" "$doc"; then
            { head -n1 "$doc"; echo; echo "$requested_by"; tail -n +2 "$doc"; } > "$doc.tmp"
            mv "$doc.tmp" "$doc"
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              add "$doc"
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Record requester identity"
            git push origin "$branch"
          elif [ ! -f "$doc" ]; then
            echo "::warning::$doc not found on $branch -- Claude may not have written it where expected; requester identity was not recorded in the doc."
          fi

          pr_number=$(gh pr list --repo "${{ github.repository }}" --head "$branch" --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            echo "No PR found for $branch -- did the draft step actually open one?" >&2
            exit 1
          fi
          body=$(gh pr view "$pr_number" --repo "${{ github.repository }}" --json body --jq '.body // ""')
          if ! grep -qF "**Requested by:**" <<<"$body"; then
            gh pr edit "$pr_number" --repo "${{ github.repository }}" --body "$requested_by"$'\n\n'"$body"
          fi

          gh issue comment "${{ steps.issue.outputs.number }}" --repo "${{ github.repository }}" \
            --body "Design doc drafted: #$pr_number. Review and edit it there -- this issue is now closed."
          gh issue close "${{ steps.issue.outputs.number }}" --repo "${{ github.repository }}"
