name: generate-issues

# M6 (redesigned 2026-08-17, see DESIGN.md's "GH_PAT: token strategy"): on merge of an
# approved "Design: <project name>" PR (see draft-design-doc.yml, M5), reads
# docs/proposals/<slug>.md and opens a provisioning issue in *this* repo telling a human
# what to run -- it does NOT create the target repo or touch any other repo itself. That
# keeps ai-app-factory's own GH_PAT scoped to ai-app-factory alone (no Administration, no
# All-repositories), and adds a second human approval gate -- provisioning, separate from
# approving the design doc -- before any tokens get spent on the new project. The human
# runs scripts/factory-new.sh + scripts/factory-secrets.sh locally (their own gh auth, no
# stored credential involved), then manually fires the new repo's own seed-milestones.yml,
# which turns the design doc into milestones + claude-go issues using that repo's own
# secrets. Full loop documented in docs/adr/0001-design-to-issues-loop.md.
#
# Triggers on push to main touching docs/proposals/*.md (a merged design PR), or manually
# via workflow_dispatch with an explicit path -- e.g. to regenerate after an edit, or to
# run a design doc that was merged before this workflow existed.

on:
  push:
    branches: [main]
    paths:
      - "docs/proposals/*.md"
  workflow_dispatch:
    inputs:
      path:
        description: "Path to the approved design doc (e.g. docs/proposals/my-project.md)"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: write
  id-token: write

jobs:
  # claude-code-action does not support being triggered directly by a bare `push` event --
  # it needs issue/PR/workflow_dispatch context to run against (confirmed the hard way: a
  # push-triggered `generate` job here failed instantly with "Unsupported event type: push"
  # during this repo's own M7 end-to-end dry run, 2026-08-17). So `push` never runs Claude
  # itself; it only resolves which design doc(s) changed and re-fires this same workflow via
  # `workflow_dispatch` once per doc -- the only path that actually reaches `generate` below.
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-dispatch generate-issues per changed design doc
        env:
          # actions:write on this same repo, which GITHUB_TOKEN already has (see
          # permissions: above) -- no GH_PAT needed anywhere in this workflow anymore.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          paths=$(git diff --name-only --diff-filter=AM \
                    "${{ github.event.before }}" "${{ github.event.after }}" \
                    -- 'docs/proposals/*.md' || true)
          if [ -z "$paths" ]; then
            echo "No design doc changes in this push -- nothing to dispatch"
            exit 0
          fi
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            echo "Dispatching generate-issues for $path"
            gh workflow run generate-issues.yml --repo "$GITHUB_REPOSITORY" -f "path=$path"
          done <<< "$paths"

  generate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate path
        run: |
          set -euo pipefail
          path="${{ inputs.path }}"
          [ -f "$path" ] || { echo "generate-issues: path '$path' not found" >&2; exit 1; }
          case "$path" in
            docs/proposals/*.md) ;;
            *) echo "generate-issues: path '$path' is not under docs/proposals/" >&2; exit 1 ;;
          esac

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          # Same subscription-auth rationale as the other workflows in this repo:
          # claude_code_oauth_token, not anthropic_api_key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # GITHUB_TOKEN only, not GH_PAT: this job's whole output is one issue opened in
          # THIS repo, which GITHUB_TOKEN's default issues:write (see permissions: above)
          # already covers -- no cross-repo capability needed post-redesign. Also fixes a
          # real notification gap: GH_PAT authenticates as mmorrow24work (the account
          # owner) themselves, and GitHub does not notify you about actions your own
          # account took -- the provisioning issue, the one thing in this whole loop that
          # most needs a human's attention, was firing zero notifications. github-actions[bot]
          # opening it is a genuinely different actor, so it notifies normally.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: false
          base_branch: main
          prompt: |
            Draft a provisioning plan for an approved design doc and open it as an issue
            in this repo (ai-app-factory) for a human to act on. Do not create any repo,
            do not run scripts/factory-new.sh, do not touch any repo other than this one.

            ## Design doc

            ${{ inputs.path }}

            ## Instructions

            You are running unattended. Nobody can approve a tool call or answer a
            question mid-run, so asking will simply end the run with nothing done. Work
            from what's given below.

            1. Read the design doc at the path above. It follows this repo's own
               DESIGN.md shape (Problem / Goal / Non-goals / Architecture / Milestones).
               The project name is the doc's H1 ("# Design: <name>"); the repo-name slug
               is the doc's filename without extension. Right after the H1 is a
               "**Requested by:** @<github-login>" line, added automatically by
               draft-design-doc.yml from the intake issue's authenticated author -- extract
               the login (without the @) from it for step 3.

            2. Determine the project type from the doc's content (Goal/Architecture
               sections): one of `nautobot-app`, `netbox-plugin`, `custom-script`
               (matching `templates/`'s three types) -- infer from context, e.g. mentions
               of a Nautobot app/job, a NetBox plugin, or neither (default
               `custom-script`).

            3. Work out the exact `scripts/factory-new.sh` invocation a human should run,
               including every `--set KEY=VALUE` its required placeholders need:
               `custom-script` always needs `--set ENTRY_POINT=<path>` (no default exists
               for a script's main file -- derive it from the doc's Architecture section,
               which usually names the main file outright); `nautobot-app`/`netbox-plugin`
               have built-in defaults for `NAUTOBOT_VERSION`/`NETBOX_VERSION` and only need
               `--set` if the doc states a different version explicitly. Every type also
               always needs `--set REQUESTER_GITHUB=<login>` (no default either) -- pull it
               straight from the "**Requested by:**" line found in step 1. `--ask` should be
               a one-line summary of the doc's Problem/Goal.

            4. Check whether an open issue in this repo already has the title
               `Provision mmorrow24work/<slug>` (`gh issue list --repo
               mmorrow24work/ai-app-factory --search "Provision mmorrow24work/<slug> in:title"`)
               -- if so, this doc has already been processed; do nothing further (idempotent
               re-run, e.g. from a workflow_dispatch retry).

            5. Otherwise, open that issue (`gh issue create --repo mmorrow24work/ai-app-factory`,
               no `claude-go` label -- this always needs a human) with a body that gives the
               exact commands to run, in order:
               ```
               scripts/factory-new.sh <type> <slug> --ask "<summary>" [--set KEY=VALUE ...]
               scripts/factory-secrets.sh <slug>
               git add projects.json && git commit -m "Register mmorrow24work/<slug>" && git push
               ```
               followed by a note that `factory-new.sh` writes `projects.json` locally but
               does not commit/push it (the third command above does), and a closing
               instruction: once those three commands have run, manually trigger
               `seed-milestones.yml` in the new repo (Actions tab -> seed-milestones -> Run
               workflow) to turn this design doc into milestones and `claude-go` issues --
               it reads the doc directly from this repo's `main` branch, no further input
               needed.

            This is a provisioning plan for a human to execute, not code to write and not
            an issue to close in this repo -- there is no "Closes #N" line to add anywhere.
          claude_args: >-
            --model claude-opus-5
            --max-turns 50
            --allowedTools "Bash(gh:*),Read,Glob,Grep"
